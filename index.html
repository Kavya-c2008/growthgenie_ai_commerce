    <script>
// GenMB auth SDK (Capability)
(function() {
/**
 * GenMB Auth SDK
 * Provides Google Sign-In, Email Magic Link, and Email + Password
 * authentication for GenMB-generated apps.
 *
 * This SDK is auto-injected and initialized. Use window.genmb.auth:
 *   window.genmb.auth.ready()          // Wait for session check (async). Auto-verifies magic link tokens from URL.
 *   window.genmb.auth.signIn()         // Open Google sign-in popup (auto-falls back to redirect)
 *   window.genmb.auth.sendMagicLink(email) // Send a sign-in link to the email. Returns Promise.
 *   window.genmb.auth.signUp(email, password, name?)        // Request OTP-verified signup. Returns Promise.
 *   window.genmb.auth.verifySignUp(email, code)             // Consume OTP, create account, sign in. Returns Promise<User|null>.
 *   window.genmb.auth.signInWithPassword(email, password)   // Direct password sign-in. Returns Promise<User|null>.
 *   window.genmb.auth.requestPasswordReset(email)           // Send password-reset OTP. Returns Promise.
 *   window.genmb.auth.confirmPasswordReset(email, code, newPassword) // Apply new password. Returns Promise.
 *   window.genmb.auth.signOut()        // Sign out user
 *   window.genmb.auth.getUser()        // Get current user or null
 *   window.genmb.auth.isAuthenticated() // Check if signed in
 *   window.genmb.auth.onAuthStateChange(callback) // Subscribe to changes
 *
 * User object: { id, email, name, picture }
 *
 * Error codes (error.code):
 *   SIGN_IN_TIMEOUT - Popup sign-in timed out after 120s
 *   SIGN_IN_FAILED  - Sign-in was rejected or returned an error
 *   VERIFY_FAILED   - Magic link verification failed (expired or already used)
 *   SIGNUP_FAILED   - Password signup failed (rate-limited, invalid password, OTP mismatch)
 *   LOGIN_FAILED    - Password login failed (bad credentials or rate-limited)
 *   RESET_FAILED    - Password reset failed (bad OTP or invalid password)
 *   NETWORK_ERROR   - Network request failed
 */

class GenMBGoogleAuth {
  constructor({ appId, baseUrl, onError }) {
    if (!appId) {
      throw new Error('GenMBGoogleAuth: appId is required')
    }

    this.appId = appId
    this.baseUrl = (baseUrl || '/api/auth/google').replace(/\/$/, '')
    this.user = null
    this.listeners = []
    this.onError = onError || console.error
    this._ready = false
    this._readyPromise = null
    this._refreshTimer = null
  }

  /**
   * Wait for SDK to be ready (session checked).
   * Auto-verifies magic link tokens if ?magic_token=xxx is in the URL.
   */
  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise

    var self = this
    this._readyPromise = this.checkSession().then(function () {
      // Auto-verify magic link token if present in URL and no existing session
      if (!self.user) {
        var params = new URLSearchParams(window.location.search)
        var magicToken = params.get('magic_token')
        if (magicToken) {
          return self.verifyMagicLink(magicToken).catch(function () {
            // Swallow error - cleanup happens below
          }).then(function () {
            // Clean up URL regardless of verification result
            params.delete('magic_token')
            var cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash
            window.history.replaceState({}, '', cleanUrl)
          })
        }
      }
    }).then(function () {
      self._ready = true
      return self
    })
    return this._readyPromise
  }

  /**
   * Sign in with Google. Tries popup first, auto-falls back to redirect if blocked.
   */
  async signIn() {
    return new Promise((resolve, reject) => {
      let settled = false

      var width = 500
      var height = 600
      var left = window.screenX + (window.outerWidth - width) / 2
      var top = window.screenY + (window.outerHeight - height) / 2

      // Relative path by default (deployed apps - keeps the bundle host-agnostic).
      // EXCEPTION: in the GenMB editor preview the app runs on an ephemeral sandbox
      // host (preview-<port>-<token>.genmb.com) that can't carry the OAuth popup
      // navigation, so point the popup at the canonical platform origin (derived as
      // the registrable parent of the sandbox host, not a hardcoded literal) and
      // tell the callback where to post the result back via &origin=.
      var navBase = this.baseUrl
      var extraOrigin = ''
      var host = window.location.hostname || ''
      if (/^preview-\d+-/.test(host) && host.slice(-10) === '.genmb.com') {
        navBase = 'https://' + host.split('.').slice(-2).join('.') + '/api/auth/google'
        extraOrigin = '&origin=' + encodeURIComponent(window.location.origin)
      }

      var popup = window.open(
        navBase + '/authorize?app_id=' + encodeURIComponent(this.appId) + '&redirect=popup' + extraOrigin,
        'genmb-google-signin',
        'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top + ',popup=1'
      )

      if (!popup || popup.closed) {
        // Popup blocked - fall back to full-page redirect
        window.location.href = navBase + '/authorize?app_id=' + encodeURIComponent(this.appId) + '&redirect=' + encodeURIComponent(window.location.href) + extraOrigin
        // Resolve with null since page will navigate away
        resolve(null)
        return
      }

      var pollSession = null

      var cleanup = function () {
        clearTimeout(timeout)
        clearInterval(checkClosed)
        if (pollSession) clearInterval(pollSession)
        window.removeEventListener('message', handleMessage)
      }

      var self = this

      var finishWithUser = function (user) {
        if (settled) return
        settled = true
        cleanup()
        try { popup.close() } catch (e) { /* cross-origin / already closed */ }
        resolve(user)
      }

      var timeout = setTimeout(function () {
        if (settled) return
        settled = true
        cleanup()
        try { popup.close() } catch (e) { /* cross-origin / already closed */ }
        var error = new Error("Sign-in took too long. Please try again.")
        error.code = 'SIGN_IN_TIMEOUT'
        self.onError(error)
        reject(error)
      }, 120000)

      var handleMessage = function (event) {
        var origin = event.origin
        var isGenmb = origin === 'https://genmb.com' || origin.endsWith('.genmb.com')
        var isLocalhost = origin.startsWith('http://localhost') || origin.startsWith('http://127.0.0.1')
        if (!isGenmb && !isLocalhost) return
        if (settled) return

        if (event.data && event.data.error) {
          settled = true
          cleanup()
          var error = new Error(event.data.error)
          error.code = 'SIGN_IN_FAILED'
          self.onError(error)
          reject(error)
        } else if (event.data && event.data.user) {
          self.user = event.data.user
          self._notifyListeners()
          self._startRefreshTimer()
          finishWithUser(self.user)
        }
      }

      // Primary completion path. Google's pages send Cross-Origin-Opener-Policy,
      // which severs window.opener and blocks reading popup.closed once the popup
      // leaves our origin - so the callback's postMessage AND the closed-poll below
      // are both unreliable. The session cookie IS set on .genmb.com the moment
      // sign-in completes, so poll the session endpoint and resolve as soon as the
      // user appears. (Mirrors how window.genmb.connectors.connect() polls status.)
      var checkingSession = false
      pollSession = setInterval(function () {
        if (settled || checkingSession) return
        checkingSession = true
        self.checkSession().then(function (user) {
          checkingSession = false
          if (user && !settled) finishWithUser(user)
        }).catch(function () { checkingSession = false })
      }, 1500)

      var checkClosed = setInterval(function () {
        var closed = false
        try { closed = popup.closed } catch (e) { closed = false }
        if (!closed || settled) return
        // The popup closed. The user may have just completed sign-in, so give the
        // session one final check before treating the close as a cancellation.
        self.checkSession().then(function (user) {
          if (settled) return
          if (user) finishWithUser(user)
          else { settled = true; cleanup(); resolve(null) }
        }).catch(function () {
          if (settled) return
          settled = true; cleanup(); resolve(null)
        })
      }, 500)

      window.addEventListener('message', handleMessage)
    })
  }

  /**
   * Send a magic link sign-in email.
   * Always resolves (returns success even if email doesn't exist, to prevent enumeration).
   * @param {string} email - User's email address
   * @returns {Promise<{success: boolean, data?: object}>}
   */
  async sendMagicLink(email) {
    try {
      var res = await fetch('/api/auth/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, app_id: this.appId }),
        credentials: 'include'
      })
      return await res.json()
    } catch (err) {
      var error = new Error("We couldn't send the sign-in link. Check your connection and try again.")
      error.code = 'NETWORK_ERROR'
      this.onError(error)
      throw error
    }
  }

  /**
   * Verify a magic link token. Called automatically by ready() if URL contains ?magic_token=xxx.
   * Can also be called manually.
   * @param {string} token - The magic link token
   * @returns {Promise<User|null>}
   */
  async verifyMagicLink(token) {
    try {
      var res = await fetch(
        '/api/auth/email/verify?token=' + encodeURIComponent(token) + '&app_id=' + encodeURIComponent(this.appId),
        { credentials: 'include' }
      )
      if (!res.ok) {
        var error = new Error("This sign-in link has expired or already been used. Send yourself a new one.")
        error.code = 'VERIFY_FAILED'
        this.onError(error)
        return null
      }
      var data = await res.json()
      if (data.success && data.user) {
        this.user = data.user
        this._notifyListeners()
        this._startRefreshTimer()
      }
      return this.user
    } catch (err) {
      var error = new Error("We couldn't sign you in. Check your connection and try again.")
      error.code = 'NETWORK_ERROR'
      this.onError(error)
      return null
    }
  }

  /**
   * Sign up a new end-user with email + password (OTP-verified).
   * Calls signUp -> show "check your email" UI -> verifySignUp.
   */
  async signUp(email, password, name) {
    try {
      var res = await fetch('/api/auth/password/signup-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, name: name || null, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success) {
        var err = new Error(data.error || 'Sign-up failed')
        err.code = 'SIGNUP_FAILED'
        this.onError(err)
        throw err
      }
      return data
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  /**
   * Verify the OTP from signUp(), create the account, and sign in.
   * Returns the User object on success, null on cookie failure.
   */
  async verifySignUp(e, email, code) {
    try {

      var res = await fetch('/api/auth/password/signup-verify', 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success || !data.user) {
        var err = new Error(data.error || 'Verification failed')
        err.code = 'SIGNUP_FAILED'
        this.onError(err)
        throw err
      }
      this.user = data.user
      this._notifyListeners()
      this._startRefreshTimer()
      return this.user
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  /**
   * Sign in an existing user with email + password.
   * Returns the User object on success, throws on failure.
   */
  async signInWithPassword(email, password) {
    try {
      var res = await fetch('/api/auth/password/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success || !data.user) {
        var err = new Error(data.error || 'Invalid email or password')
        err.code = 'LOGIN_FAILED'
        this.onError(err)
        throw err
      }
      this.user = data.user
      this._notifyListeners()
      this._startRefreshTimer()
      return this.user
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  /**
   * Send a password-reset OTP to the email. Always resolves (generic 200).
   */
  async requestPasswordReset(email) {
    try {
      var res = await fetch('/api/auth/password/reset-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, app_id: this.appId }),
        credentials: 'include',
      })
      return await res.json()
    } catch (err) {
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  /**
   * Confirm a password reset with OTP + new password.
   */
  async confirmPasswordReset(email, code, newPassword) {
    try {
      var res = await fetch('/api/auth/password/reset-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, code: code, newPassword: newPassword, app_id: this.appId }),
        credentials: 'include',
      })
      var data = await res.json()
      if (!data.success) {
        var err = new Error(data.error || 'Password reset failed')
        err.code = 'RESET_FAILED'
        this.onError(err)
        throw err
      }
      return data
    } catch (err) {
      if (err && err.code) throw err
      var nerr = new Error("We couldn't reach the server. Check your connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      this.onError(nerr)
      throw nerr
    }
  }

  /**
   * Sign out the current user.
   */
  async signOut() {
    this._stopRefreshTimer()

    try {
      await fetch(this.baseUrl + '/signout?app_id=' + encodeURIComponent(this.appId), {
        method: 'POST',
        credentials: 'include'
      })
    } catch (err) {
      err.code = 'NETWORK_ERROR'
      this.onError(err)
    }

    this.user = null
    this._notifyListeners()
  }

  /**
   * Check if user has an active session. Also refreshes the session expiry.
   */
  async checkSession() {
    try {
      var res = await fetch(this.baseUrl + '/session?app_id=' + encodeURIComponent(this.appId), {
        credentials: 'include'
      })

      if (res.ok) {
        this.user = await res.json()
        this._notifyListeners()
        this._startRefreshTimer()
        // Refresh session expiry in the background
        this._refreshSession()
        return this.user
      }
      this._stopRefreshTimer()
      return null
    } catch (err) {
      err.code = 'NETWORK_ERROR'
      this.onError(err)
      return null
    }
  }

  /**
   * Get the current user.
   */
  getUser() {
    return this.user
  }

  /**
   * Check if user is authenticated.
   */
  isAuthenticated() {
    return this.user !== null
  }

  /**
   * Subscribe to auth state changes.
   */
  onAuthStateChange(callback) {
    this.listeners.push(callback)
    callback(this.user)
    var self = this
    return function () {
      self.listeners = self.listeners.filter(function (l) { return l !== callback })
    }
  }

  /**
   * Refresh the session to extend its expiry (fire-and-forget).
   */
  _refreshSession() {
    fetch(this.baseUrl + '/refresh?app_id=' + encodeURIComponent(this.appId), {
      method: 'POST',
      credentials: 'include'
    }).catch(function () {
      // Silent - refresh is best-effort
    })
  }

  /**
   * Start periodic session refresh (every 30 minutes).
   */
  _startRefreshTimer() {
    this._stopRefreshTimer()
    var self = this
    this._refreshTimer = setInterval(function () {
      if (self.user) {
        self._refreshSession()
      }
    }, 30 * 60 * 1000) // 30 minutes
  }

  /**
   * Stop periodic session refresh.
   */
  _stopRefreshTimer() {
    if (this._refreshTimer) {
      clearInterval(this._refreshTimer)
      this._refreshTimer = null
    }
  }

  _notifyListeners() {
    var self = this
    this.listeners.forEach(function (listener) {
      try {
        listener(self.user)
      } catch (err) {
        console.error('Error in auth state listener:', err)
      }
    })
  }
}

// Export for ES modules (when loaded via import)
if (typeof window !== 'undefined') {
  window.GenMBGoogleAuth = GenMBGoogleAuth;
}


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "GVXJHfbSo3ro",
  "baseUrl": "/api/auth/google"
};
window.genmb.auth = new GenMBGoogleAuth(config);
window.genmb.auth.ready();
})();
</script>
    <script>
// GenMB billing SDK (Capability)
(function() {
/**
 * GenMB Billing SDK
 *
 * Auto-injected; available at window.genmb.billing. Zero setup - just call:
 *   window.genmb.billing.checkout({ amount: 9.99, currency: 'usd', productName: 'PDF download' })
 *   window.genmb.billing.subscribe({ amount: 9, currency: 'usd', interval: 'month', productName: 'Pro' })
 *   window.genmb.billing.openPortal({ returnUrl: location.href })
 *   window.genmb.billing.reportUsage({ subscriptionItemId, quantity })
 *   window.genmb.billing.verifySession(sessionId) - confirm a Checkout Session
 *     actually paid, server-side. Call this when the app returns from Stripe
 *     (the sessionId is available from the `checkout_return` event or the
 *     `session_id` query param) before trusting a successUrl redirect.
 *
 * All amounts are in major units (9.99 = $9.99). The SDK converts to cents
 * before hitting the backend. Currency defaults to USD.
 *
 * Error codes (error.code):
 *   CONNECT_REQUIRED  - $500 free-tier cap reached; app owner must connect
 *                       Stripe before new sales. Show a friendly message;
 *                       the in-editor banner already nudges the owner.
 *   OVER_CAP          - single amount alone exceeds the cap
 *   BILLING_DISABLED  - owner explicitly turned billing off
 *   AUTH_REQUIRED     - subscribe/portal called without signed-in user
 *   AMOUNT_INVALID    - amount under Stripe minimum (50 cents) or non-numeric
 *   HMAC_INVALID      - SDK token rejected (cached page over 48h old; reload)
 *   SESSION_NOT_FOUND - verifySession() couldn't find that session for this app
 *   NETWORK_ERROR
 */

class GenMBBilling {
  constructor({ appId, baseUrl, billingToken, onError } = {}) {
    if (!appId) throw new Error('GenMBBilling: appId is required')
    if (!billingToken) throw new Error('GenMBBilling: billingToken is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/billing').replace(/\/$/, '')) + '/' + appId
    this.token = billingToken
    this.customer = null
    this.listeners = []
    this.onError = onError || (function (e) { console.error('[genmb.billing]', e) })
    this._ready = false
    this._readyPromise = null
  }

  async ready() {
    if (this._ready) return this
    if (this._readyPromise) return this._readyPromise
    var self = this
    this._readyPromise = this._refreshCustomer().then(function () {
      self._ready = true
      // If returning from Checkout, surface the session id once for app-side handling.
      try {
        var params = new URLSearchParams(window.location.search)
        var sid = params.get('session_id')
        if (sid) {
          self._notify({ type: 'checkout_return', sessionId: sid })
          params.delete('session_id')
          var cleanUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash
          window.history.replaceState({}, '', cleanUrl)
        }
      } catch (_) {}
      return self
    })
    return this._readyPromise
  }

  getCustomer() { return this.customer }

  onCustomerChange(callback) {
    if (typeof callback !== 'function') return function () {}
    this.listeners.push(callback)
    try { callback(this.customer) } catch (_) {}
    var self = this
    return function () {
      self.listeners = self.listeners.filter(function (l) { return l !== callback })
    }
  }

  async checkout(opts) {
    var args = opts || {}
    var amountCents = this._toCents(args.amount)
    var body = {
      amount_cents: amountCents,
      currency: (args.currency || 'usd').toLowerCase(),
      product_name: args.productName || 'Purchase',
      success_url: args.successUrl || this._defaultSuccessUrl(),
      cancel_url: args.cancelUrl || window.location.href,
      end_user_email: args.endUserEmail || null,
      metadata: args.metadata || null,
    }
    var data = await this._fetch('/checkout', body)
    if (args.redirect !== false && data.url) {
      window.location.href = data.url
    }
    return data
  }

  async subscribe(opts) {
    var args = opts || {}
    var body = {
      success_url: args.successUrl || this._defaultSuccessUrl(),
      cancel_url: args.cancelUrl || window.location.href,
      price_id: args.priceId || null,
      amount_cents: args.amount != null ? this._toCents(args.amount) : null,
      currency: args.currency || (args.amount != null ? 'usd' : null),
      interval: args.interval || null,
      product_name: args.productName || null,
    }
    var data = await this._fetch('/subscribe', body)
    if (args.redirect !== false && data.url) {
      window.location.href = data.url
    }
    return data
  }

  async openPortal(opts) {
    var args = opts || {}
    var body = { return_url: args.returnUrl || window.location.href }
    var data = await this._fetch('/portal', body)
    if (args.redirect !== false && data.url) {
      window.location.href = data.url
    }
    return data
  }

  async reportUsage(opts) {
    var args = opts || {}
    return this._fetch('/usage', {
      subscription_item_id: args.subscriptionItemId,
      quantity: args.quantity,
      timestamp: args.timestamp || null,
      action: args.action || 'increment',
    })
  }

  async verifySession(sessionId) {
    var resp
    try {
      resp = await fetch(this.baseUrl + '/session/' + encodeURIComponent(sessionId), {
        method: 'GET',
        credentials: 'include',
        headers: { 'X-Billing-Token': this.token },
      })
    } catch (e) {
      var nerr = new Error((e && e.message) || "Check your internet connection and try again.")
      nerr.code = 'NETWORK_ERROR'
      throw nerr
    }
    var json = null
    try { json = await resp.json() } catch (_) {}
    if (!resp.ok) {
      var err = new Error((json && json.error_message) || resp.statusText || "Something went wrong. Please try again.")
      err.code = (json && json.error_code) || 'NETWORK_ERROR'
      err.status = resp.status
      throw err
    }
    return (json && json.data) || {}
  }

  // ─── internals ─────────────────────────────────────────────────────────

  async _refreshCustomer() {
    try {
      var res = await fetch(this.baseUrl + '/customer', {
        method: 'GET',
        credentials: 'include',
        headers: { 'X-Billing-Token': this.token },
      })
      if (!res.ok) {
        this.customer = null
        return
      }
      var json = await res.json()
      var data = (json && json.data) || null
      if (data && data.exists === false) {
        this.customer = null
      } else {
        this.customer = data
      }
      this._notify(this.customer)
    } catch (_) {
      this.customer = null
    }
  }

  _notify(payload) {
    for (var i = 0; i < this.listeners.length; i++) {
      try { this.listeners[i](payload) } catch (e) { this.onError(e) }
    }
  }

  _toCents(amount) {
    if (typeof amount !== 'number' || !isFinite(amount) || amount <= 0) {
      var err = new Error("The amount has to be a positive number.")
      err.code = 'AMOUNT_INVALID'
      throw err
    }

    let currency = 'usd'
    for (const { productId, qty } of items) {

            priceCents,

(function() {
/**
 * GenMB Key-Value Store SDK
 * Zero-config key-value persistence for generated apps. No schema, no setup.
 * Auto-injected at window.genmb.kv.
 *
 * Usage: window.genmb.kv.method()
 *   .get(key)            — Read a value (resolves to null if the key is absent)
 *   .set(key, value)     — Write/overwrite a value (any JSON-serializable value)
 *   .delete(key)         — Remove a key (resolves to true if a key was removed)
 *   .list(prefix?)       — List entries, optionally filtered by key prefix.
 *                          Resolves to { data: [{ key, value }], total, limit, offset };
 *                          the entries are in `result.data`.
 *   .increment(key, by?) — Atomically add `by` (default 1) to a numeric value.
 *                          Resolves to the new value.
 *
 * Keys are scoped to this app. Values are limited in size; oversized writes
 * surface a friendly error rather than raw backend grammar.
 */

// Map any error string (raw or backend-friendly) to ONE plain sentence safe to
// show a non-technical end user. The backend already returns friendly text, but
// this is the last-mile guard for older deployments / unmapped cases so raw
// Postgres grammar never reaches the UI.
function _friendlyMsg(s) {
  if (!s) return 'Something went wrong. Please try again.'
  var t = String(s)
  if (/too large|exceeds|payload too|value too/i.test(t)) return 'That is too big to save. Please use a smaller value.'
  if (/too many|quota|limit reached|max keys/i.test(t)) return 'This app has reached its storage limit.'
  if (/being set up|setting up/i.test(t)) return 'Setting things up. Please try again in a moment.'
  if (/not a number|not numeric|cannot increment/i.test(t)) return "That value can't be counted. Please reset it first."
  return t
}

class GenMBKeyValueStore {
  constructor(config) {
    if (!config.appId) {
      throw new Error('GenMBKeyValueStore: appId is required')
    }
    this._base = (config.baseUrl || '/api/kv') + '/' + config.appId
  }

  get(key) {
    // Read a single value. A missing key is a normal outcome, not an error:
    // resolve to null so callers can `??` a default without try/catch.
    // The router wraps the value in { value } (APIResponse envelope); unwrap so
    // callers get the bare stored value the docstring/promptTemplate promise.
    return this._request('GET', this._base + '/' + encodeURIComponent(key), null, true).then(function (d) {
      return d == null ? null : d.value
    })
  }

  set(key, value) {
    return this._request('POST', this._base, { key: key, value: value })
  }

  delete(key) {
    return this._request('DELETE', this._base + '/' + encodeURIComponent(key))
  }

  list(prefix) {
    var qs = ''
    var parts = []
    if (prefix) parts.push('prefix=' + encodeURIComponent(prefix))
    parts.push('limit=1000')
    qs = '?' + parts.join('&')
    return this._request('GET', this._base + qs)
  }

  increment(key, by) {
    if (by === undefined) by = 1
    // The router wraps the new count in { key, value }; unwrap to the bare
    // number so callers get the new value the docstring/promptTemplate promise.
    return this._request('POST', this._base + '/' + encodeURIComponent(key) + '/increment', { by: by }).then(function (d) {
      return d.value
    })
  }

  // NOTE: methods call this bound (this._request(...)), so it may reference
  // `this`-free behavior via the captured args. Retry is a loop, not recursion.
  // `nullOn404` lets get() treat an absent key as a resolved null rather than a
  // throw, while every other method still surfaces a 404 as an error.
  async _request(method, url, body, nullOn404) {
    var attempt = 0
    var provisionAttempt = 0
    while (true) {
      var controller = new AbortController()
      var timer = setTimeout(function () { controller.abort() }, 30000)
      try {
        var options = {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal
        }
        if (body) {
          options.body = JSON.stringify(body)
        }
        var res = await fetch(url, options)
        clearTimeout(timer)
        if (!res.ok) {
          if (res.status === 404 && nullOn404) {
            return null
          }
          // Retry transient server failures (5xx) with backoff. NEVER retry
          // 4xx - a validation/size error never succeeds on replay.
          if (res.status >= 500 && attempt < 2) {
            attempt++
            await new Promise(function (r) { setTimeout(r, 300 * attempt) })
            continue
          }
          var errBody = null
          try { errBody = await res.json() } catch (_) {}
          // Deployed apps proxy raised backend exceptions through verbatim, so
          // the message lands in `detail` (FastAPI default), not `error` (only
          // the preview proxy maps detail->error). Read both or the friendly
          // messages below never see the real text in prod.
          var raw = (errBody && (errBody.error || errBody.detail)) || ('Request failed (HTTP ' + res.status + ')')

          // up. The backend returns "Setting things up"; wait and retry
          // transparently so a non-technical user's first calls just work.
          if (/being set up|setting up/i.test(raw) && provisionAttempt < 6) {

            await new Promise(function (r) { setTimeout(r, Math.min(3000, 800 * provisionAttempt)) })

        }

        if (err.name === 'AbortError') {

          throw new Error('The store took too long to respond. Please try again.')

(function() {
/**
 * GenMB Admin Table SDK - window.genmb.adminTable
 *
 * Helpers for building spreadsheet-grade admin tables: filters, group-by,
 * CSV/XLSX export, saved views (persisted per user), bulk update.
 *
 * Pair with window.genmb.db (relational-db) for table CRUD. The UI itself
 * is rendered by the user's React/vanilla code; this SDK does not own the
 * DOM.
 */
class GenMBAdminTable {
  constructor({ appId, baseUrl } = {}) {
    if (!appId) throw new Error('GenMBAdminTable: appId is required')
    this.appId = appId
    this.baseUrl = ((baseUrl || '/api/admin-table').replace(/\/$/, '')) + '/' + appId
  }

  async ready() { return this }

  // ─── State helpers ────────────────────────────────────────────────────

  buildEmptyView() {
    return {
      filters: [],
      sort: null,
      hiddenColumns: [],
      pageSize: 25,
      groupBy: null,
    }
  }

  // ─── Filter ───────────────────────────────────────────────────────────

  filterRows(rows, filters) {
    if (!filters || filters.length === 0) return rows
    return rows.filter((row) => filters.every((f) => this._matchOne(row, f)))
  }

  _matchOne(row, f) {
    const v = row[f.field]
    const t = f.value
    switch (f.op) {
      case '=': return v === t
      case '!=': return v !== t
      case 'contains': return v != null && String(v).toLowerCase().includes(String(t).toLowerCase())
      case '>': return v != null && v > t
      case '<': return v != null && v < t
      case '>=': return v != null && v >= t
      case '<=': return v != null && v <= t
      case 'in': return Array.isArray(t) && t.includes(v)
      case 'not_in': return Array.isArray(t) && !t.includes(v)
      case 'is_null': return v == null
      case 'is_not_null': return v != null
      default: return true
    }
  }

  groupBy(rows, field) {
    if (!field) return { '': rows }
    return rows.reduce((acc, row) => {
      const key = row[field] == null ? '' : String(row[field])
      if (!acc[key]) acc[key] = []
      acc[key].push(row)
      return acc
    }, {})
  }

  // ─── Export ───────────────────────────────────────────────────────────

  exportCsv(rows, columns, { filename = 'export.csv' } = {}) {
    const cols = (columns || (rows[0] ? Object.keys(rows[0]) : [])).map((c) =>
      typeof c === 'string' ? { key: c, label: c } : c
    )
    const header = cols.map((c) => this._csvCell(c.label)).join(',')
    const body = rows
      .map((row) => cols.map((c) => this._csvCell(row[c.key])).join(','))
      .join('\r\n')
    const csv = header + '\r\n' + body
    this._download(filename, new Blob([csv], { type: 'text/csv;charset=utf-8' }))

    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"'

  async exportXlsx(rows, columns, { filename = 'export.xlsx' } = {}) {
    if (!window.XLSX) {
      await this._loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js')
    }
    const cols = (columns || (rows[0] ? Object.keys(rows[0]) : [])).map((c) =>
      typeof c === 'string' ? { key: c, label: c } : c
    )
    const data = [cols.map((c) => c.label)].concat(
      rows.map((row) => cols.map((c) => row[c.key]))
    )
    const ws = window.XLSX.utils.aoa_to_sheet(data)
    const wb = window.XLSX.utils.book_new()
    window.XLSX.utils.book_append_sheet(wb, ws, 'Sheet1')
    window.XLSX.writeFile(wb, filename)
  }

  _loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = src
      s.onload = resolve
      s.onerror = reject
      document.head.appendChild(s)
    })
  }

  _download(filename, blob) {
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = filename
    document.body.appendChild(a)
    a.click()
    a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 0)
  }

  // ─── Bulk update ──────────────────────────────────────────────────────

  async bulkUpdate(ids, patch, table, { onProgress } = {}) {
    if (!Array.isArray(ids) || ids.length === 0) return { updated: 0, errors: [] }
    if (!table) throw new Error('bulkUpdate requires table')
    if (!window.genmb || !window.genmb.db || !window.genmb.db[table]) {
      throw new Error(`bulkUpdate: window.genmb.db.${table} is not available`)
    }
    const errors = []
    let updated = 0
    for (let i = 0; i < ids.length; i++) {
      const id = ids[i]
      try {
        await window.genmb.db[table].update(id, patch)
        updated += 1
      } catch (e) {
        errors.push({ id, message: e && e.message ? e.message : String(e) })
      }
      if (onProgress) onProgress({ done: i + 1, total: ids.length, updated, errors: errors.length })
    }
    return { updated, errors }
  }

  // ─── Saved views (localStorage; per-browser, per-app) ────────────────

  get _viewsKey() { return 'genmb.adminTable.views.' + this.appId }

  _readAllViews() {
    try {
      return JSON.parse(localStorage.getItem(this._viewsKey) || '[]')
    } catch { return [] }
  }

  _writeAllViews(views) {
    localStorage.setItem(this._viewsKey, JSON.stringify(views))
  }

  savedViews = {
    list: async () => ({ views: this._readAllViews() }),
    save: async (name, state) => {
      const views = this._readAllViews()
      const id = 'v_' + Math.random().toString(36).slice(2, 10)
      const view = { id, name, state, createdAt: new Date().toISOString() }
      views.push(view)
      this._writeAllViews(views)
      return { view }
    },
    load: async (id) => {
      const view = this._readAllViews().find((v) => v.id === id)
      if (!view) throw new Error('view not found')
      return { view }
    },
    delete: async (id) => {
      this._writeAllViews(this._readAllViews().filter((v) => v.id !== id))
      return { deleted: true }
    },
  }
}

window.GenMBAdminTable = GenMBAdminTable


// Auto-initialize
window.genmb = window.genmb || {};
const config = {
  "appId": "GVXJHfbSo3ro"
};
window.genmb.adminTable = new GenMBAdminTable(config);
window.genmb.adminTable.ready();
})();
